  - 1759943.716457859
  - 1759943.716457859
  mixture_ratio:
  - 2.1742499551880994
  - 2.1742499551880994
  thrust:
  - 24178.491606506825
  - 26178.491606506825
  copv_pressure:
  - 21627914.667066757
