# Local fin and counterweight refinement of flight_pressure_fed_search12_best.
# Counterweight: 1-6 kg. Fins: +/-5% of base values, capped to aero-table limits.
# All other design variables remain fixed.

base_config: Configs/Pressurefed/flight_pressure_fed_search12_best.yaml
tank_ids:
  oxidizer: ox_tank
  fuel: fuel_tank
  pressurant: press_tank
workers: 1
max_evaluations: 1000
algorithm: slsqp
reference_mass: 190.0
hard_constraints:
- tank.ox_tank.wall_min
- tank.fuel_tank.wall_min
- max_length_to_diameter
- goal_apogee
- max_burn_duration
- min_stability_calibers
- tank.fuel_tank.Tmin
- tank.fuel_tank.Pmin
- tank.ox_tank.Tmin
- tank.ox_tank.Pmin
- tank.press_tank.Tmin
- tank.press_tank.Pmin
soft_penalties:
  downrange:
    target_m: 32000.0
    scale_m: 10000.0
    weight: 0.5
  stability_length_fraction:
    lower_target: 0.1
    upper_target: 0.2
    scale: 0.05
    weight: 0.15
  max_q:
    target_pa: 145000.0
    scale_pa: 10000.0
    weight: 0.0
conditional_geometry: false
failure_policy:
  native_retries: 1
  consecutive_limit: 50
  window: 100
  rate_limit: 0.95
  repeated_limit: 3
evaluation_overrides:
  tanks.ox_tank.min_wall_thickness: 0.00254
  tanks.fuel_tank.min_wall_thickness: 0.00254
  tanks.press_tank.mass: 29.5
  tanks.fuel_tank.min_temperature: 80.0
  tanks.fuel_tank.min_pressure: 68947.57293168
  tanks.ox_tank.min_temperature: 80.0
  tanks.ox_tank.min_pressure: 68947.57293168
  tanks.press_tank.min_pressure: 1.034e6
  tanks.press_tank.min_temperature: 120.0
  constraints.max_length_to_diameter: 31.0
  constraints.min_stability_calibers: 2.0
  constraints.goal_apogee: 130000.0
  constraints.max_burn_duration: 75.0
  simulation.t_end: 600.0
  environment.max_altitude: 300000.0
bounds:
  counterweight_mass:
  - 1.0
  - 10.0
  exit_pressure:
  - 59096.95801911459
  - 59096.95801911459
  omld:
